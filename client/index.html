<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theater-Bild-Gelöte</title>
<meta name="theme-color" content="#101418">
<meta name="description" content="LED-Bühnen planen, Medien auf Panels einpassen und Lieferdateien im Format des Hauses erstellen.">

<!-- three kommt ohne Bundler direkt vom Server, siehe server/static -->
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.js",
    "three/addons/": "/vendor/three/addons/"
  }
}
</script>

<style>
:root{
  --bg:#0b0d12; --pnl:#14181f; --ln:#242b36; --fg:#c9d3e0; --dim:#6b7787; --acc:#ff2e88;
  --ok:#3ddc84; --warn:#ffb020; --err:#ff4d4f; --info:#4aa3ff;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg);
  font:13px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2b3340;border:2px solid var(--bg);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3a4453}

/* ---------------------------------------------------------------- Geruest */
/* grid-template-columns:minmax(0,1fr) ist Pflicht, nicht Kosmetik:
   ohne die Angabe bekommt die implizite Spalte "auto" und richtet sich nach
   der max-content-Breite ihres breitesten Kindes. Das ist die Kopfzeile
   (flex-wrap:nowrap mit vielen Bedienelementen). Auf 1280 px Fensterbreite
   wuchs das Raster dadurch auf 1426 px, und weil body overflow:hidden hat,
   verschwand der rechte Inspektor kommentarlos hinter dem Fensterrand. */
#app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh;min-height:0}
#topbar{
  display:flex;align-items:center;gap:14px;padding:6px 10px;
  background:var(--pnl);border-bottom:1px solid var(--ln);flex-wrap:nowrap;
  /* Wird das Fenster zu schmal, scrollt die Kopfzeile - statt das ganze
     Fenster breiter zu machen und den Inspektor abzuschneiden. */
  min-width:0;overflow-x:auto;overflow-y:hidden;
}
#main{display:grid;grid-template-columns:268px minmax(0,1fr) 312px;min-height:0}
#left,#right{background:var(--pnl);overflow:auto;min-height:0}
#left{border-right:1px solid var(--ln)}
#right{border-left:1px solid var(--ln)}
#center{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
#bottom{background:var(--pnl);border-top:1px solid var(--ln);max-height:42vh;display:flex;flex-direction:column}
#statusbar{
  display:flex;align-items:center;gap:10px;padding:3px 10px;border-top:1px solid var(--ln);
  font-size:12px;color:var(--dim);min-height:22px;
}
#statusbar.err{color:var(--err)}
#statusbar.warn{color:var(--warn)}

/* Vollbild-Viewport (Taste F) */
body.viewport-full #left,
body.viewport-full #right,
body.viewport-full #bottom{display:none}
body.viewport-full #main{grid-template-columns:minmax(0,1fr)}

/* ---------------------------------------------------------------- Kopfzeile */
.brand{font-weight:700;letter-spacing:.5px;color:var(--acc);white-space:nowrap}
.brand small{color:var(--dim);font-weight:400;letter-spacing:0}
#projName{
  background:transparent;border:1px solid transparent;color:var(--fg);
  font:600 13px "Segoe UI",system-ui;padding:2px 6px;border-radius:3px;width:170px;
}
#projName:hover{border-color:var(--ln)}
#projName:focus{border-color:var(--acc);outline:none;background:var(--bg)}
#venueName{color:var(--dim);white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
#transport{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:200px}
#tlScrub{flex:1 1 auto;min-width:80px}
#tlTime{font:12px/1 var(--mono);color:var(--fg);white-space:nowrap;min-width:96px;text-align:right}
#tlLoop{width:58px}
#langSel{width:auto;min-width:82px;font-size:12px}
.sep{width:1px;height:22px;background:var(--ln);flex:0 0 auto}

/* ---------------------------------------------------------------- Bausteine */
.btn{
  background:#1c222c;color:var(--fg);border:1px solid var(--ln);border-radius:3px;
  padding:3px 9px;font:13px "Segoe UI",system-ui;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:#232b37;border-color:#313a48}
.btn:active{background:#171d26}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:1px 6px;font-size:12px}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.acc:hover{background:#ff4f9c}
.btn.ghost{background:transparent}
.btn.danger{border-color:#5a2730;color:#ff8f92}
.btn.danger:hover{background:#31191d}
.seg{display:flex;gap:2px}
.seg .btn{border-radius:0}
.seg .btn:first-child{border-radius:3px 0 0 3px}
.seg .btn:last-child{border-radius:0 3px 3px 0}

input[type=text],input[type=number],input[type=search],select,textarea{
  background:#0e1219;color:var(--fg);border:1px solid var(--ln);border-radius:3px;
  padding:2px 5px;font:13px "Segoe UI",system-ui;min-width:0;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=number]{width:64px;text-align:right;font-family:var(--mono);font-size:12px}
input[type=range]{accent-color:var(--acc);height:16px}
input[type=checkbox]{accent-color:var(--acc);vertical-align:-2px}
textarea{font:12px/1.4 var(--mono);resize:vertical;width:100%}
label{user-select:none}

.row{display:flex;align-items:center;gap:6px}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.grow{flex:1 1 auto;min-width:0}
.dim{color:var(--dim)}
.right{margin-left:auto}
.mono{font-family:var(--mono);font-size:12px}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sec{border-bottom:1px solid var(--ln)}
.sec>.hd{
  display:flex;align-items:center;gap:6px;padding:5px 9px;cursor:default;
  font:600 10.5px/1 "Segoe UI",system-ui;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);
  background:#11151c;
}
.sec>.hd .right{font-weight:400;letter-spacing:0;text-transform:none;font-size:11px}
.sec>.bd{padding:7px 9px;display:flex;flex-direction:column;gap:6px}
.sec.collapsed>.bd{display:none}
.hd.click{cursor:pointer}
.hd.click:hover{color:var(--fg)}

.fld{display:flex;align-items:center;gap:6px}
.fld>.lbl{width:78px;flex:0 0 auto;color:var(--dim);font-size:12px}
.fld>.lbl.w54{width:54px}
.fld .unit{color:var(--dim);font-size:11px;min-width:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.grid2 .fld>.lbl,.grid4 .fld>.lbl{width:auto;min-width:14px}

.tag{
  display:inline-block;padding:0 5px;border-radius:2px;font-size:11px;line-height:16px;
  background:#232b37;color:var(--dim);border:1px solid var(--ln);
}
.tag.ok{color:var(--ok);border-color:#1e4432}
.tag.warn{color:var(--warn);border-color:#4a3a12}
.tag.err{color:var(--err);border-color:#4d2124}
.tag.info{color:var(--info);border-color:#1d3550}
.tag.acc{color:#fff;background:var(--acc);border-color:var(--acc)}

.amp{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.amp.ok{background:var(--ok);box-shadow:0 0 6px #3ddc8455}
.amp.warn{background:var(--warn);box-shadow:0 0 6px #ffb02055}
.amp.err{background:var(--err);box-shadow:0 0 6px #ff4d4f66}
#ffmpegAmp{display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 6px;border-radius:3px}
#ffmpegAmp:hover{background:#1c222c}

.msg{padding:6px 8px;border-radius:3px;border:1px solid var(--ln);background:#11151c;font-size:12px}
.msg.err{border-color:#4d2124;background:#201114;color:#ff9a9c}
.msg.warn{border-color:#4a3a12;background:#1f1a0e;color:#ffcf7a}
.msg.ok{border-color:#1e4432;background:#0f1c16;color:#8ee7b6}
.msg.info{border-color:#1d3550;background:#0e1620;color:#9ccbff}

.bar{height:5px;background:#0e1219;border-radius:3px;overflow:hidden;border:1px solid var(--ln)}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .15s linear}
.bar.ok>i{background:var(--ok)}
.bar.err>i{background:var(--err)}

table.tbl{border-collapse:collapse;width:100%;font-size:12px}
table.tbl th{
  text-align:left;color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.6px;padding:3px 6px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:#11151c;
}
table.tbl td{padding:3px 6px;border-bottom:1px solid #1b212a;vertical-align:middle}
table.tbl tr:hover td{background:#171c25}
td.num,th.num{text-align:right;font-family:var(--mono)}

/* ---------------------------------------------------------------- links: Waende + Slots */
.wall{border-bottom:1px solid var(--ln);padding:6px 9px}
.wall.active{background:#181d26;box-shadow:inset 3px 0 0 var(--acc)}
.wall .ttl{display:flex;align-items:center;gap:6px;cursor:pointer}
.wall .ttl b{font-size:13px}
.wall .ttl .dim{font-size:11px}
.slot{border-bottom:1px solid #1b212a}
.slot>.sh{display:flex;align-items:center;gap:6px;padding:4px 9px;cursor:pointer}
.slot.active>.sh{background:#1b2129;box-shadow:inset 3px 0 0 var(--acc)}
.slot>.sh:hover{background:#181d25}
.slot .layers{padding:0 0 3px 0}
.layer{
  display:flex;align-items:center;gap:5px;padding:3px 9px 3px 20px;cursor:pointer;font-size:12px;
  border-left:3px solid transparent;
}
.layer:hover{background:#181d25}
.layer.sel{background:#221a20;border-left-color:var(--acc)}
.layer .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .x{color:var(--dim);cursor:pointer;padding:0 3px}
.layer .x:hover{color:var(--err)}
.layer.off .nm{color:var(--dim);text-decoration:line-through}
.drop{outline:1px dashed var(--acc);outline-offset:-2px}

/* ---------------------------------------------------------------- Mitte */
.view{display:none;flex:1 1 auto;min-height:0;overflow:hidden}
.view.on{display:flex;flex-direction:column}
.viewbody{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:auto}
#vpStage,#vpEditor{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#07090d}
#vpStage canvas,#vpEditor canvas{display:block;width:100%;height:100%}
.vpNote{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:20px;color:var(--dim);font-size:12px;pointer-events:none;
}
.vpNote .msg{pointer-events:auto;max-width:520px}
.vpBar{
  display:flex;align-items:center;gap:8px;padding:4px 9px;background:var(--pnl);
  border-bottom:1px solid var(--ln);flex-wrap:wrap;flex:0 0 auto;
}
.pad{padding:9px;display:flex;flex-direction:column;gap:9px}

/* ---------------------------------------------------------------- Bibliothek */
.libList{overflow:auto;border:1px solid var(--ln);border-radius:3px;background:#11151c;max-height:none}
.libRow td{white-space:nowrap}
.libRow img.th{
  width:72px;height:41px;object-fit:cover;background:#000;border:1px solid var(--ln);border-radius:2px;display:block;
}
.libRow.sel td{background:#221a20}
.issues{display:flex;gap:3px;flex-wrap:wrap;max-width:220px;white-space:normal}

/* ---------------------------------------------------------------- Jobs */
#jobsList{overflow:auto;max-height:30vh}
.job{border-bottom:1px solid #1b212a;padding:4px 9px}
.job .top{display:flex;align-items:center;gap:8px}
.job .lbl2{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .pct{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:38px;text-align:right}
.joblog{
  margin-top:4px;background:#07090d;border:1px solid var(--ln);border-radius:3px;
  font:11px/1.35 var(--mono);color:#9fb0c4;padding:5px;max-height:200px;overflow:auto;white-space:pre-wrap;
}
.cmdbox{
  background:#07090d;border:1px solid var(--ln);border-radius:3px;padding:7px;
  font:11.5px/1.5 var(--mono);color:#9fe0c4;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;
}

/* ---------------------------------------------------------------- QC */
.qcItem{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid var(--ln);border-radius:3px;background:#11151c}
.qcItem .amp{margin-top:5px}
.qcArts{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.qcArts img{max-height:96px;border:1px solid var(--ln);border-radius:2px;cursor:zoom-in;background:#000}

/* ---------------------------------------------------------------- Overlay */
#overlayRoot{position:fixed;inset:0;display:none;z-index:50;background:#04060ad9;backdrop-filter:blur(2px)}
#overlayRoot.on{display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{
  background:var(--pnl);border:1px solid var(--ln);border-radius:5px;box-shadow:0 18px 60px #000a;
  max-width:min(760px,94vw);max-height:88vh;overflow:auto;display:flex;flex-direction:column;
}
.dlg>.hd{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ln);
  font-weight:600;background:#11151c;position:sticky;top:0;
}
.dlg>.bd{padding:12px;display:flex;flex-direction:column;gap:10px}
.dlg h2{margin:0;font-size:15px}
.dlg h3{margin:6px 0 0;font-size:12.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.dlg p{margin:0;font-size:12.5px;line-height:1.5}
.fsList{border:1px solid var(--ln);border-radius:3px;background:#0e1219;max-height:44vh;overflow:auto}
.fsRow{display:flex;gap:7px;align-items:center;padding:3px 8px;cursor:pointer;font-size:12.5px}
.fsRow:hover{background:#1a202a}
.fsRow.dir{color:#cfe0f4}
.fsRow .sz{margin-left:auto;color:var(--dim);font:11px var(--mono)}
img.zoom{max-width:92vw;max-height:88vh;border:1px solid var(--ln);border-radius:3px;background:#000}
</style>
<link rel="stylesheet" href="./src/studio.css">
</head>
<body>
<div id="app">

  <!-- ============================================================ Kopfzeile -->
  <header id="topbar">
    <span class="brand"><span class="brand-symbol" aria-hidden="true">▥</span><span>Theater-Bild-Gelöte<small>STAGE STUDIO</small></span></span>
    <div id="projectTools"><input id="projName" type="text" title="Projektname" data-i18n-title
           aria-label="Projektname" data-i18n-aria
           placeholder="Projektname" data-i18n-placeholder spellcheck="false"><button id="projectMenu" type="button" class="btn sm ghost" title="Projekt verwalten" data-i18n-title aria-label="Projekt verwalten" data-i18n-aria>···</button></div>
    <span id="venueName" class="dim nowrap">—</span>
    <span class="sep"></span>

    <div id="transport" aria-label="Wiedergabe und Zeitleiste" data-i18n-aria>
      <button id="btnPlay" class="btn" title="Wiedergabe (Leertaste)" data-i18n-title
              aria-label="Wiedergabe" data-i18n-aria>▶</button>
      <input id="tlScrub" type="range" min="0" max="20" step="0.01" value="0"
             title="Zeitleiste" data-i18n-title aria-label="Zeitleiste" data-i18n-aria>
      <span id="tlTime">00:00.00 / 20,0 s</span>
      <span class="dim" style="font-size:11px" data-i18n>Loop</span>
      <input id="tlLoop" type="number" min="1" max="3600" step="1" value="20"
             title="Looplänge in Sekunden" data-i18n-title
             aria-label="Looplänge in Sekunden" data-i18n-aria>
      <span class="dim" style="font-size:11px">s</span>
    </div>

    <span class="sep"></span>
    <nav class="seg" id="viewSwitch" aria-label="Arbeitsbereiche" data-i18n-aria>
      <button class="btn" data-view="stage3d" title="3D-Bühne" data-i18n-title data-i18n>3D-Bühne</button>
      <button class="btn" data-view="editor" title="Panel-Editor" data-i18n-title data-i18n>Panel-Editor</button>
      <button class="btn" data-view="library" title="Bibliothek" data-i18n-title data-i18n>Bibliothek</button>
      <button class="btn" data-view="render" title="Render" data-i18n-title data-i18n>Render</button>
      <button class="btn" data-view="qc" title="Qualitätskontrolle" data-i18n-title data-i18n>QC</button>
      <button class="btn" data-view="venue" title="Venues — Häuser, Wände, Panels" data-i18n-title data-i18n>Venues</button>
    </nav>
    <button id="quickStartButton" type="button" class="btn sm ghost" title="Kurzanleitung öffnen" data-i18n-title data-i18n>Anleitung</button>

    <span class="sep"></span>
    <button type="button" id="ffmpegAmp" title="ffmpeg-Status — klicken für Einrichtung" data-i18n-title>
      <span class="amp" id="ffmpegDot"></span>
      <span id="ffmpegTxt" class="dim" style="font-size:12px">ffmpeg …</span>
    </button>

    <!-- Sprachumschalter. Die Auswahl fuellt main.js aus i18n.LANGUAGES —
         Sprachnamen stehen in ihrer eigenen Sprache und werden nie uebersetzt. -->
    <select id="langSel" title="Sprache" data-i18n-title aria-label="Sprache" data-i18n-aria></select>
  </header>

  <!-- ============================================================ Hauptteil -->
  <div id="main">
    <aside id="left" aria-label="Wände und Panels" data-i18n-aria></aside>

    <section id="center">
      <!-- 3D-Buehne -->
      <div class="view" id="viewStage3d">
        <div class="vpBar" id="stageBar"></div>
        <div id="vpStage"><canvas id="stageCanvas" aria-label="Interaktive 3D-Bühne" data-i18n-aria></canvas><div class="vpNote" id="stageNote"></div><div id="stageHud" class="stage-hud"></div><div id="stageHint" class="stage-hint"></div></div>
      </div>
      <!-- Panel-Editor -->
      <div class="view" id="viewEditor">
        <div class="vpBar" id="editorBar"></div>
        <div id="vpEditor"><canvas id="editorCanvas"></canvas><div class="vpNote" id="editorNote"></div></div>
      </div>
      <!-- Bibliothek / Render / QC / Venues -->
      <div class="view" id="viewLibrary"></div>
      <div class="view" id="viewRender"></div>
      <div class="view" id="viewQc"></div>
      <div class="view" id="viewVenue"></div>
    </section>

    <aside id="right" aria-label="Einstellungen" data-i18n-aria></aside>
  </div>

  <!-- ============================================================ Fusszeile -->
  <footer id="bottom">
    <div id="jobsRoot"></div>
    <div id="statusbar"><span class="amp" id="statusDot"></span><span id="statusText" data-i18n>Startet …</span></div>
  </footer>
</div>

<div id="overlayRoot"></div>

<!-- Der Einstiegsassistent haengt sich hier ein (client/src/ui/onboarding.js). -->
<div id="onboardingRoot"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
