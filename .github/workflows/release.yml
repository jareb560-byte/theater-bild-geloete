name: Desktop-Installer bauen

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandene Versionsmarke, z.B. v0.3.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            label: Windows x64
            binary: dist/desktop/win-unpacked/Theater-Bild-Geloete.exe
          - os: macos-15
            platform: mac
            arch: arm64
            label: macOS Apple Silicon
            binary: dist/desktop/mac-arm64/Theater-Bild-Geloete.app/Contents/MacOS/Theater-Bild-Geloete
          - os: macos-15-intel
            platform: mac
            arch: x64
            label: macOS Intel
            binary: dist/desktop/mac/Theater-Bild-Geloete.app/Contents/MacOS/Theater-Bild-Geloete
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TBG_HOME: ${{ github.workspace }}/.cache/release-test-workspace
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Version und native Architektur prüfen
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          node -e "if(process.env.RELEASE_TAG!=='v'+require('./package.json').version)throw Error('Tag/version mismatch');if(process.arch!==process.env.TARGET_ARCH)throw Error('Runner architecture mismatch')"
      - run: npm ci --no-audit --no-fund
      - name: FFmpeg über denselben Weg wie im App-Assistenten installieren
        run: node server/cli/install-ffmpeg.js --force
      - name: Bezogene Programme ausführen und Testpfade festlegen
        run: node tools/verify-render-runtime.js
      - name: Regressionen und echte HAP/ProRes/MPEG-2-Dateien prüfen
        run: npm test
      - name: Lokalen App-Zugriff prüfen
        run: node tools/test-desktop-server.cjs
      - name: Installer bauen
        run: npm run build:desktop -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Gebaute App mit echter Oberfläche prüfen
        run: node tools/smoke-desktop.js "${{ matrix.binary }}"
      - name: Installer bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg

  release:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - name: Prüfsummen und Installationsanleitung
        shell: bash
        run: |
          cp desktop/INSTALLATION.md installers/INSTALLATION.md
          cd installers
          sha256sum *.exe *.dmg > SHA256SUMS.txt
      - name: Geprüfte Pakete als Release-Entwurf bereitstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Theater-Bild-Gelöte $RELEASE_TAG" --notes-file desktop/INSTALLATION.md
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
